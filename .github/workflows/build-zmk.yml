# Compile le firmware ZMK du Halcyon Ferris sans fil.
#
# Écrit à la main plutôt qu'en appelant le workflow réutilisable de ZMK, parce
# que celui-ci lance `west update` depuis la racine du dépôt alors que
# `west init -l <dir>` pose son .west dans le parent de <dir>. Avec une config
# imbriquée, west cherche son espace de travail au-dessus de l'endroit où il
# vient de le créer, et ne le trouve pas. Ici on fixe nous-mêmes le répertoire
# de travail, et la profondeur cesse d'être un problème.

name: Build ZMK firmware

on:
  push:
    paths: ['keyboards/splitkb/halcyon-ferris-wireless/zmk/**', '.github/workflows/build-zmk.yml']
  pull_request:
    paths: ['keyboards/splitkb/halcyon-ferris-wireless/zmk/**']
  workflow_dispatch:

env:
  ZMK_DIR: keyboards/splitkb/halcyon-ferris-wireless/zmk

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.fetch.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: fetch
        run: echo "include=$(yq -oj -I0 '.include' $ZMK_DIR/build.yaml)" >> $GITHUB_OUTPUT

  build:
    needs: matrix
    runs-on: ubuntu-24.04
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    name: ${{ matrix.artifact-name }}
    steps:
      - uses: actions/checkout@v4

      - name: West init
        working-directory: ${{ env.ZMK_DIR }}
        run: west init -l config

      - name: West update
        working-directory: ${{ env.ZMK_DIR }}
        run: west update --fetch-opt=--filter=tree:0

      - name: Zephyr export
        working-directory: ${{ env.ZMK_DIR }}
        run: west zephyr-export

      - name: Build
        working-directory: ${{ env.ZMK_DIR }}
        run: |
          west build -s zmk/app -d build -b "${{ matrix.board }}" \
            ${{ matrix.snippet && format('-S {0}', matrix.snippet) || '' }} -- \
            -DSHIELD="${{ matrix.shield }}" \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/${ZMK_DIR}/config" \
            ${{ matrix.cmake-args }}

      - name: Collect firmware
        working-directory: ${{ env.ZMK_DIR }}
        run: |
          mkdir -p artifacts
          cp build/zephyr/zmk.uf2 "artifacts/${{ matrix.artifact-name }}.uf2"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ env.ZMK_DIR }}/artifacts
