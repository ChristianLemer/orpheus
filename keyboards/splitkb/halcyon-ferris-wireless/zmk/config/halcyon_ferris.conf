# Réglages du firmware. Ce qui touche au comportement des touches vit dans le
# .keymap ; ici, seulement ce qui se règle à la compilation.

# Mise en veille profonde des moitiés — c'est le principal levier d'autonomie.
CONFIG_ZMK_SLEEP=y
# Après 15 min sans frappe (900000 ms).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Rapporter le niveau de batterie à l'hôte.
CONFIG_ZMK_BATTERY_REPORTING=y

# Support pointeur. Désactivé par défaut dans ZMK : sans lui, &mkp, &mmv et &msc
# sont compilés hors du firmware, la couche souris ne fait rien et l'hôte ne voit
# aucune interface Mouse — alors que le keymap, lui, les contient bien.
CONFIG_ZMK_POINTING=y

# ZMK Studio sans verrou. Par défaut Studio exige qu'on presse &studio_unlock sur le
# clavier avant d'éditer ; ce keymap n'en porte pas, si bien que Studio restait bloqué
# sur « Unlock to continue ». Le dongle ne parle à Studio que par son câble USB.
CONFIG_ZMK_STUDIO_LOCKING=n
